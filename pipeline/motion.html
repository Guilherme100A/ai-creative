<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:AB;src:url(ArchivoBlack-Regular.ttf)}
@font-face{font-family:SM;src:url(SpaceMono-Bold.ttf)}
@font-face{font-family:LG;src:url(LuckiestGuy-Regular.ttf)}
@font-face{font-family:SG;src:url(Sniglet-ExtraBold.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#141518}
#stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(ellipse 80% 55% at 50% 45%,#3a3d45 0%,#24262b 55%,#121316 100%)}
#grid{position:absolute;inset:-200px;background-image:radial-gradient(rgba(255,255,255,.09) 2px,transparent 2.5px);background-size:36px 36px}
#glow{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;
  background:radial-gradient(circle,rgba(198,243,107,.16) 0%,rgba(198,243,107,0) 60%)}
/* brand */
#brand{position:absolute;inset:0;display:none}
.logo{position:absolute;left:50%;top:700px;transform-origin:center;background:#ececee;color:#111;border-radius:34px;
  font:700 78px SM;letter-spacing:4px;padding:34px 60px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.08);white-space:nowrap}
.item{position:absolute;left:50%;display:flex;align-items:center;gap:30px;white-space:nowrap;font:52px AB;letter-spacing:0.5px;color:#fff;
  text-shadow:0 6px 24px rgba(0,0,0,.6)}
.item svg{width:84px;height:84px;flex:none}
.item.lime{color:#c6f36b}
.tag{position:absolute;left:50%;top:560px;font:700 34px SM;letter-spacing:6px;color:#c6f36b;white-space:nowrap}
/* cta vivo */
#saiba{position:absolute;left:50%;top:330px;background:#c6f36b;color:#111;font:64px AB;letter-spacing:1px;padding:24px 60px;border-radius:70px;white-space:nowrap;box-shadow:0 20px 70px rgba(198,243,107,.35)}
#seta{position:absolute;left:50%;top:1400px;width:120px;height:120px;margin-left:-60px}
#cursor{position:absolute;left:0;top:0;width:150px;height:150px;transform-origin:11% 6%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
#toque{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:9px solid #c6f36b;opacity:0}
/* site */
#site{position:absolute;inset:0;perspective:1700px;display:none}
#plane{position:absolute;width:880px;border-radius:46px;overflow:hidden;
  box-shadow:0 60px 140px rgba(0,0,0,.75),0 0 0 3px rgba(255,255,255,.12)}
#plane img{display:block;width:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 65% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
</style></head>
<body><div id="stage"><div id="grid"></div><div id="glow"></div>
<div id="brand"></div>
<div id="site"><div id="plane"><img id="img" src="site.png"><div id="shine"></div></div></div>
<div id="vig"></div></div>
<script>
const ICONS={
 bolt:'<svg viewBox="0 0 24 24"><path fill="#c6f36b" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
 pix:'<svg viewBox="0 0 24 24"><g fill="#c6f36b" transform="rotate(45 12 12)"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></g></svg>',
 shield:'<svg viewBox="0 0 24 24"><path fill="#c6f36b" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path fill="#16171a" d="m10.6 15.6-3.3-3.3 1.4-1.4 1.9 1.9 4.7-4.7 1.4 1.4z"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path fill="#c6f36b" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path fill="#16171a" d="M7 8h10v2H7zm0 4h7v2H7z"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path fill="#c6f36b" d="m12 2 3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>',
 cart:'<svg viewBox="0 0 24 24"><path fill="#c6f36b" d="M3 3h3l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L22 7H7.2"/><circle fill="#c6f36b" cx="10" cy="20" r="1.8"/><circle fill="#c6f36b" cx="18" cy="20" r="1.8"/></svg>'};
const P=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const grid=document.getElementById('grid'),glow=document.getElementById('glow');
if(P.type==='brand'){
  const B=document.getElementById('brand');B.style.display='block';
  let h='';if(P.tag)h+=`<div class="tag" id="tag">${P.tag}</div>`;
  h+='<div class="logo" id="logo">BASIC-BUILD</div>';
  (P.items||[]).forEach((it,i)=>h+=`<div class="item ${it.lime?'lime':''}" id="it${i}" style="top:${930+i*150}px">${ICONS[it.icon]||''}<span>${it.text}</span></div>`);
  B.innerHTML=h;
  if(P.cta)B.insertAdjacentHTML('beforeend','<div id="saiba">SAIBA MAIS</div>'+
   '<div id="seta"><svg viewBox="0 0 24 24"><path fill="none" stroke="#c6f36b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M5 9l7 7 7-7"/></svg></div>'+
   '<div id="toque"></div><div id="cursor"><svg viewBox="0 0 36 36"><path fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" d="M4 2v28l7-7 5 11 5-2-5-11h10z"/></svg></div>');
}else{document.getElementById('site').style.display='block';}
const K=880/1170;
window.render=function(t){
  const T=P.dur;
  grid.style.transform=`translate(${-t*14}px,${-t*22}px)`;
  glow.style.opacity=.75+.25*Math.sin(t*2.2);
  if(P.type==='brand'){
    const lg=document.getElementById('logo');const s=back(t/0.45);
    lg.style.transform=`translate(-50%,0) scale(${lerp(.4,1,s)*(1+0.03*t)}) rotate(${lerp(-6,0,eout(t/0.5))}deg)`;lg.style.opacity=clamp(t/0.15);
    const tg=document.getElementById('tag');if(tg){const a=eout((t-.15)/.4);tg.style.opacity=a;tg.style.transform=`translate(-50%,${lerp(30,0,a)}px)`;}
    (P.items||[]).forEach((it,i)=>{const e=document.getElementById('it'+i);const st=(it.at??(0.35+i*0.3));const a=back((t-st)/0.4);
      e.style.opacity=clamp((t-st)/0.12);e.style.transform=`translate(-50%,0) translateX(${lerp(-160,0,eout((t-st)/0.4))}px) scale(${lerp(.6,1,a)})`;});
    if(P.cta){const press=Math.max(...[1.98,2.9].map(tt=>clamp(1-Math.abs(t-tt)/0.12)));
      if(t>0.6)lg.style.transform+=` translateY(${-Math.abs(Math.sin((t-0.6)*3.2))*12}px)`; // logo: bounce leve depois do pop
      const sb=document.getElementById('saiba');sb.style.opacity=clamp((t-0.9)/0.12);sb.style.transform=`translate(-50%,0) scale(${lerp(.5,1,back((t-0.9)/0.4))*(1+0.04*Math.max(0,Math.sin((t-1.3)*5)))})`;
      const se=document.getElementById('seta');se.style.opacity=clamp((t-1.6)/0.2);se.style.transform=`translateY(${Math.abs(Math.sin((t-1.6)*4.5))*26}px)`;
      const m=eout((t-1.4)/0.5),cu=document.getElementById('cursor');cu.style.opacity=clamp((t-1.4)/0.15); // cursor entra e toca no CLICA ABAIXO
      cu.style.transform=`translate(${lerp(960,826,m)}px,${lerp(1760,1262,m)}px) scale(${1-0.18*press})`;
      const to=document.getElementById('toque'),r=[1.98,2.9].map(tt=>t-tt).find(d=>d>=0&&d<0.45);to.style.left='843px';to.style.top='1270px';
      to.style.opacity=r==null?0:1-r/0.45;to.style.transform=`scale(${r==null?0.3:0.3+r*2.4})`;
      const it=document.getElementById('it2');if(it)it.style.transform+=` scale(${1+0.08*press})`;}
    document.getElementById('stage').style.transform=`scale(${1+0.025*t})`;
  }else{
    const pl=document.getElementById('plane');const u=eio(t/T);
    const y=lerp(P.y0,P.y1,u)*K;
    const rx=lerp(P.r0[0],P.r1[0],u),ry=lerp(P.r0[1],P.r1[1],u),rz=lerp(P.r0[2],P.r1[2],u),z=lerp(P.z0,P.z1,u);
    const intro=eout(t/0.5);
    const cx=lerp(P.x0??585,P.x1??585,u)*K; // x0/x1 (opcional): centro horizontal no print, para aproximar um bloco só
    pl.style.left=(540-cx)+'px';pl.style.top=(960-y)+'px';pl.style.transformOrigin=`${cx}px ${y}px`;
    pl.style.transform=`translateY(${lerp(260,0,intro)}px) scale(${z*lerp(.85,1,intro)}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
    pl.style.opacity=clamp(t/0.2);
    const sh=document.getElementById('shine');const sx=lerp(-60,160,(t/T));
    sh.style.background=`linear-gradient(115deg,rgba(255,255,255,0) ${sx-20}%,rgba(255,255,255,.10) ${sx}%,rgba(255,255,255,0) ${sx+20}%)`;
  }
};
render(0);document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
