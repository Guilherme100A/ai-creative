<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:480px;height:480px;overflow:hidden;background:transparent}
#w{position:absolute;left:60px;top:60px;width:360px;height:360px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
#a{width:100%;height:100%}
</style>
<script src="node_modules/lottie-web/build/player/lottie.min.js"></script>
</head><body><div id="w"><div id="a"></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const back=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let anim,P;
window.setup=(data,params)=>{P=params;anim=lottie.loadAnimation({container:document.getElementById('a'),renderer:'svg',loop:false,autoplay:false,animationData:data});};
window.render=t=>{
  const fr=anim.frameRate||30,tot=anim.totalFrames;anim.goToAndStop(Math.floor(t*fr*(P.speed||1))%tot,true);
  const D=P.dur,inn=back(t/0.28),out=clamp((D-t)/0.16);
  let s=inn*out,r=0,x=0,y=0;
  if(P.style==='pop'){r=Math.sin(t*5)*6;}
  if(P.style==='dance'){y=-Math.abs(Math.sin(t*9))*46;r=Math.sin(t*9)*16;s*=1+Math.abs(Math.cos(t*9))*0.06;}
  if(P.style==='shake'){x=Math.sin(t*38)*7*clamp(1-t/0.8);y=t*10;r=-4;}
  if(P.style==='float'){y=-t*40;r=Math.sin(t*4)*5;}
  if(P.style==='slam'){s=(t<0.12?2.2-1.2*(t/0.12):1)*out;r=-8;}
  document.getElementById('w').style.transform=`translate(${x}px,${y}px) rotate(${r+(P.tilt||0)}deg) scale(${s})`;
};
</script></body></html>
