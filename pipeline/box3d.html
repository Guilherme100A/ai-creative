<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#scene{position:absolute;inset:0;perspective:1500px}
#card{position:absolute;left:110px;top:530px;width:860px;height:860px;transform-style:preserve-3d}
.slab{position:absolute;inset:0;border-radius:64px;background:#1b1c20}
#shadow{position:absolute;left:150px;top:600px;width:780px;height:780px;border-radius:80px;background:rgba(0,0,0,.55);filter:blur(60px)}
#face{position:absolute;inset:0;border-radius:64px;overflow:hidden;transform:translateZ(0);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
#face img{display:block;width:100%;height:100%}
#sheen{position:absolute;inset:0;pointer-events:none}
</style></head>
<body><div id="shadow"></div><div id="scene"><div id="card">
<div class="slab" style="transform:translateZ(-22px);background:#111215"></div>
<div class="slab" style="transform:translateZ(-15px)"></div>
<div class="slab" style="transform:translateZ(-8px);background:#26282e"></div>
<div id="face"><img id="img"><div id="sheen"></div></div>
</div></div>
<script>
const P=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eout=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const card=document.getElementById('card'),sh=document.getElementById('shadow'),sheen=document.getElementById('sheen');
window.render=function(t){
  const s=P.pose; // lado da inclinação: 1 ou -1
  let ry=s*13+Math.sin(t*1.6)*2.5, rx=7+Math.cos(t*1.3)*1.5, rz=0, ty=Math.sin(t*2)*8, tx=0, sc=1, op=1;
  if(P.entry){const u=t/0.38, e=eout(u), b=back(u);
    if(P.entry==='flip'){ry=lerp(s*80,ry,e);sc=lerp(.75,1,e);op=clamp(u*3);}
    if(P.entry==='rise'){ty+=lerp(900,0,e);rx=lerp(55,rx,e);op=clamp(u*3);}
    if(P.entry==='pop'){sc=lerp(.35,1,b);rz=lerp(-10*s,0,e);op=clamp(u*4);}
    if(P.entry==='swing'){tx=lerp(-s*700,0,e);rz=lerp(-s*22,0,b);ry=lerp(-s*35,ry,e);op=clamp(u*3);}
  }
  if(P.seco&&!P.flat)op=1; // seco no 3D: mantém o movimento de entrada, sem fade de opacidade (sem rosto fantasma)
  if(P.flat){ // quadrado normal (sem 3D): só um pop de entrada
    const u=t/0.28;rx=0;ry=0;rz=0;tx=0;ty=0;sc=lerp(.6,1,back(u));op=clamp(u*3);
    if(P.seco){sc=lerp(.82,1,eout(t/0.1));op=1;} // seco: corte seco, sem fade de opacidade, pop de 0,1s
    document.querySelectorAll('.slab').forEach(e=>e.style.display='none');}
  card.style.transform=`translate(${tx}px,${ty}px) scale(${sc}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  card.style.opacity=op;
  sh.style.transform=`translate(${tx+s*-30}px,${ty*0.5+40}px) scale(${sc*0.95})`;sh.style.opacity=op*0.9;
  const x=((t*0.35)%1)*260-80;
  sheen.style.background=`linear-gradient(115deg,rgba(255,255,255,0) ${x-18}%,rgba(255,255,255,.13) ${x}%,rgba(255,255,255,0) ${x+18}%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 35%)`;
};
</script></body></html>
